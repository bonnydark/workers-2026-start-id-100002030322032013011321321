<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NO-NAME / Control</title><style>:root{--b:#070707;--p:#101011;--l:#27272a;--t:#f4f4f2;--m:#777}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{height:70px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;padding:0 5vw}.brand{font-weight:800;letter-spacing:.1em}.nav a:last-child{color:#999}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 70px)}aside{border-right:1px solid var(--l);padding:30px 16px}.side{padding:11px 13px;color:#777;cursor:pointer;border-radius:6px}.side.on,.side:hover{background:#151515;color:#fff}.main{padding:42px 5vw;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:end}.ey{font-size:10px;letter-spacing:.16em;color:#666}.top h1{font-size:48px;letter-spacing:-.05em;margin:12px 0 30px}.status{border:1px solid var(--l);padding:8px 11px;color:#888}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric,.box{background:var(--p);border:1px solid var(--l);padding:22px}.metric span{font-size:10px;color:#666;letter-spacing:.13em}.metric b{display:block;font-size:29px;margin-top:14px}.view{display:none}.view.on{display:block}.bar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.bar h2{margin:0}.btn{border:0;background:#eee;color:#080808;padding:10px 14px;border-radius:6px;font-weight:700;cursor:pointer}.table{border:1px solid var(--l);background:var(--p)}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 120px;gap:12px;padding:15px 17px;border-bottom:1px solid #1d1d1f;align-items:center}.row:last-child{border:0}.muted{color:#777}.act{display:flex;gap:5px}.mini{background:#171719;border:1px solid #29292b;color:#bbb;padding:6px 8px;border-radius:5px;cursor:pointer}.empty{text-al class="close" onclick="closeM()">✕</button><h2 id="mt">Add</h2><form class="form" id="form"></form></div></div><script>
var K="noname_v2",types={projects:[["name","Name","text"],["status","Status","select","active|paused|done"],["budget","Budget","number"],["description","Description","textarea"]],clients:[["name","Name","text"],["company","Company","text"],["email","Email","email"],["status","Status","select","lead|active|inactive"]],services:[["name","Name","text"],["price","Price","number"],["status","Status","select","active|paused"]],tasks:[["title","Title","text"],["status","Status","select","todo|doing|done"],["priority","Priority","select","low|normal|high"],["due_date","Due date","date"]],finance:[["type","Type","select","income|expense"],["amount","Amount","number"],["description","Description","text"],["transaction_date","Date","date"]]},S=JSON.parse(localStorage.getItem(K)||'{"projects":[],"clients":[],"services":[],"tasks":[],"finance":[]}'),cur="",eid=null,$=function(x){return document.getElementById(x)},money=function(n){return new Intl.NumberFormat("vi-VN").format(+n||0)+" ₫"};function save(){localStorage.setItem(K,JSON.stringify(S))}function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function render(){var inc=S.finance.filter(function(x){return x.type==="income"}).reduce(function(a,x){return a+(+x.amount||0)},0),out=S.finance.filter(function(x){return x.type==="expense"}).reduce(function(a,x){return a+(+x.amount||0)},0);$("rev").textContent=money(inc);$("profit").textContent=money(inc-out);$("pc").textContent=S.projects.length;$("cc").textContent=S.clients.length;var h='<section class="view on" id="v-overview"><div class="box"><h2>NO-NAME</h2><p class="muted">Start solo. Make useful things. Build cash flow. Scale the system.</p></div></section>';Object.keys(types).forEach(function(t){h+='<section class="view" id="v-'+t+'"><div class="bar"><h2>'+t.charAt(0).toUpperCase()+t.slice(1)+'</h2><button class="btn" onclick="openM(\\''+t+'\\')">+ Add</button></div><div class="table" id="l-'+t+'"></div></section>'});$("views").innerHTML=h;Object.keys(types).forEach(list)}
function list(t){var a=S[t],el=$("l-"+t);el.innerHTML=a.map(function(x){var n=x.name||x.title||x.description||"Transaction",d=t==="finance"?money(x.amount):t==="projects"?money(x.budget):t==="services"?money(x.price):x.company||x.priority||x.email||"";return '<div class="row"><b>'+esc(n)+'</b><span class="muted">'+esc(x.status||x.type||"")+'</span><span class="detail muted">'+esc(d)+'</span><span class="act"><button class="mini" onclick="edit(\\''+t+'\\',\\''+x.id+'\\')">Edit</button><button class="mini" onclick="del(\\''+t+'\\',\\''+x.id+'\\')">Delete</button></span></div>'}).join("")||'<div class="empty">Nothing here yet.</div>'}
function openM(t,id){cur=t;eid=id||null;var old=(S[t]||[]).find(function(x){return x.id===id})||{};$("mt").textContent=(id?"Edit ":"Add ")+t.slice(0,-1);$("form").innerHTML=types[t].map(function(f){var k=f[0],l=f[1],ty=f[2],op=f[3];if(ty==="textarea")return '<label class="full">'+l+'<textarea name="'+k+'">'+esc(old[k]||"")+'</textarea></label>';if(ty==="select")return '<label>'+l+'<select name="'+k+'">'+op.split("|").map(function(o){return '<option value="'+o+'" '+(o===old[k]?"selected":"")+'>'+o+'</option>'}).join("")+'</select></label>';return '<label>'+l+'<input name="'+k+'" type="'+ty+'" value="'+esc(old[k]||"")+'" required></label>'}).join("")+'<div class="full"><button class="btn" type="submit">Save</button></div>';$("modal").classList.add("on")}
function closeM(){$("modal").classList.remove("on");eid=null}function edit(t,id){openM(t,id)}function del(t,id){if(confirm("Delete this item?")){S[t]=S[t].filter(function(x){return x.id!==id});save();render()}}
$("form").onsubmit=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));["budget","price","amount"].forEach(function(k){if(k in d)d[k]=+d[k]||0});if(eid){var i=S[cur].findIndex(function(x){return x.id===eid});S[cur][i]=Object.assign({},S[cur][i],d)}else S[cur].unshift(Object.assign({id:crypto.randomUUID()},d));save();closeM();render()};document.addEventListener("click",function(e){var s=e.target.closest(".side");if(!s)return;document.querySelectorAll(".side").forEach(function(x){x.classList.remove("on")});document.querySelectorAll(".view").forEach(function(x){x.classList.remove("on")});s.classList.add("on");$("v-"+s.dataset.v).classList.add("on")});$("date").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"short",year:"numeric"}).toUpperCase();render();
</script></body></html>
